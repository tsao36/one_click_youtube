video:
  duration_minutes: 5.0
  width: 1920
  height: 1080
  aspect_ratio: '16:9'
  fps: 30
  language: Traditional Chinese
  visual_style: photorealistic_cinema
  narration_style: warm, curious, conversational documentary narrator
hook:
  enabled: true
  video_duration: 300.0          # 影片預設總長 300 秒 (5 分鐘)
  duration: 12.0                 # Hook 長度 12 秒
  mode: select_core_conflict     # 模式：從完整影片選取最能代表核心衝突的片段
  avoid_repeated_narration: true # 避免重複播放旁白
  claim_window_seconds: 5.0      # 開場前 5 秒呈現與標題相符的核心主張
  ban_greetings: true            # 避免無意義寒暄
  ban_logo_animation: true       # 避免 Logo 動畫或過長片頭
  ban_clickbait: true            # 避免誇大標題
  include_in_total_duration: true # Hook 納入總片長，不得額外增加影片長度
script:
  speech_rate_wpm: 250
  research_enabled: false
  single_pass_word_limit: 350
scenes:
  average_duration: 4.0
  minimum_duration: 3.0
  maximum_duration: 5.0
  llm_batch_size: 8
images:
  provider: nano-banana-2.1
  fallback_provider: placeholder
  auto_stock_mode: balanced
  workflow: workflows/default_image.json
  checkpoint: nano-banana-2.1
  width: 1024
  height: 576
  steps: 4
  cfg: 6.5
  sampler: dpmpp_2m
  scheduler: karras
  retries: 2
  timeout_seconds: 900
  free_vram_after_stage: true
animation:
  ai_video_percentage: 10
  min_motion_zoom: 1.04
  max_motion_zoom: 1.08
  oversample: 2
voice:
  profile: mytsaovoice
  speech_rate: 1.12
  pause_after_scene: 0.35
  lead_in: 0.25
  target_lufs: -16
  sample_rate: 48000
subtitles:
  enabled: true
  burn_in: true
  style: youtube_standard
  font: Microsoft JhengHei UI
  motion_graphics_callouts: true
  callouts_enabled: true
  callout_style: neutral_centered
  max_chars_per_line: 42
  max_lines: 2
music:
  enabled: true
  directory: data/music
  volume_db: -16
  ducking: true
  fade_in: 1.5
  fade_out: 2.5
rendering:
  encoder: auto
  threads: 0
  # 0 = auto (scales up to 12 parallel workers on 16-24+ thread CPUs for fast scene clip rendering)
  clip_concurrency: 0
  crf: 20
  preset: medium
  audio_bitrate: 192k
  transition: crossfade
  transition_duration: 0.2
  phase_turn_duration: 3.0
  final_lufs: -14
  draft_width: 854
  draft_height: 480
  render_draft_first: false
cloud:
  enabled: false
  max_video_clips: 8
  max_cost_usd: 5
llm:
  json_retries: 3
youtube:
  channel_url: https://www.youtube.com/@tsao36
  channel_handle: '@tsao36'
  default_privacy: public
  default_category_id: '28'
  auto_generate_chapters: true
  min_chapter_duration_seconds: 15.0
  max_chapter_duration_seconds: 180.0
  auto_generate_tags: true
  include_asset_sources: true
